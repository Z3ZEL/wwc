<!DOCTYPE html>
<html lang="seo:lang">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- SEO tags come from assets/seo.json, filled in by tools/seo-gen (Trunk post_build hook). -->
  <!-- seo:head -->
  <link data-trunk rel="rust" data-wasm-opt="s" />
  <!-- Markdown documents (legal pages…), fetched by the app when opened: ARCHITECTURE §5.11. -->
  <link data-trunk rel="copy-dir" href="assets/documents" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    /* Readable for crawlers and no-JS browsers; the app canvas covers it once running. */
    #about { max-width: 40rem; margin: 3rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; line-height: 1.5; }
    canvas#app { position: absolute; inset: 0; width: 100%; height: 100%; }
    /* eframe's hidden text input (ADR 0018): its text showed next to the cursor. Backport of
       egui PR #8550, not released in 0.36.2; remove once egui is upgraded past it. */
    canvas#app + input { color: transparent; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <!-- seo:body -->
  <canvas id="app"></canvas>
</body>
</html>
