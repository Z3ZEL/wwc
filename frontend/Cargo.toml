[package]
name = "frontend"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "frontend"
path = "src/main.rs"

[dependencies]
egui = "0.36.2"
ehttp = { version = "0.7.1", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Web-only: the app shell and the map. Pure logic (state, api, theme, ui) also builds on
# the host so `cargo test` runs without a browser.
# egui / eframe / egui_extras / walkers must be upgraded together (walkers pins an egui version).
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "persistence"] }
# Image loaders for campsite photos: `http` fetches /api/files URLs, `image` + `webp` decode them.
egui_extras = { version = "0.36.2", default-features = false, features = ["http", "image", "webp"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
walkers = "0.60.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Location",
    "console",
    # Photo picker (src/web/file_picker.rs)
    "HtmlElement",
    "HtmlInputElement",
    "File",
    "FileList",
    "Blob",
    "BlobPropertyBag",
    "Event",
    "ImageBitmap",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "ImageEncodeOptions",
] }
console_error_panic_hook = "0.1"
