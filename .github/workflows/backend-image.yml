# Release: builds backend/Dockerfile for linux/amd64 and linux/arm64/v8 and pushes it to the GitHub
# Container Registry (ADR 0013), then triggers the Render frontend deploy (ADR 0015).
# Runs when a GitHub Release is published (tag vX.Y.Z), or by hand from the Actions tab.
# Tags: X.Y.Z, X.Y and latest for a release (prereleases get only X.Y.Z-rc.N), sha-<short> always,
# and the branch name for a manual run. A tag that isn't full semver (e.g. 1.0-rc.1) gets no version tag.
# The frontend deploy runs for full releases only and needs the DEPLOY_HOOK repository secret.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GHCR image names must be lowercase; the owner isn't.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${OWNER,,}/wwc-backend" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}
      # arm64 is emulated; the build only downloads and unpacks PocketBase.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # latest=auto: only for a non-prerelease semver tag.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Render deploy hook: Render builds the HEAD of the branch it tracks, so release from that branch.
  deploy-frontend:
    needs: publish
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then echo "::error::DEPLOY_HOOK secret is not set"; exit 1; fi
          curl -fsS --retry 3 -X POST -o /dev/null "$DEPLOY_HOOK"
