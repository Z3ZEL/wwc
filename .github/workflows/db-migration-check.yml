# Warns on PRs that change the database structure (backend/pb_migrations/).
# Never blocks: the job always succeeds.
#
# SECURITY: pull_request_target runs with a write token, even for fork PRs.
# This workflow must NEVER check out or execute code from the PR.
# It only reads the PR's file list through the GitHub API.
# Note: GitHub runs the version of this file on master, so edits only apply after merge.
name: DB migration check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ['backend/pb_migrations/**']

permissions:
  pull-requests: write

jobs:
  schema-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const DIR = 'backend/pb_migrations/';
            const MARKER = '<!-- db-migration-check -->';
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number });
            const touched = files.filter(f =>
              f.filename.startsWith(DIR) || (f.previous_filename || '').startsWith(DIR));
            const added = touched.filter(f => f.status === 'added');
            const changed = touched.filter(f => f.status !== 'added');

            // File names are PR-controlled: strip backticks so they stay inside code spans.
            const code = s => '`' + String(s).replace(/`/g, '') + '`';
            const item = f => f.status === 'renamed'
              ? `- ${code(f.previous_filename)} → ${code(f.filename)} (renamed)`
              : `- ${code(f.filename)} (${f.status})`;

            for (const f of added) {
              core.warning('New database migration: this PR changes the database structure.', { file: f.filename });
            }
            for (const f of changed) {
              core.warning(`Existing migration ${f.status}: PocketBase does not re-run applied migrations; add a new migration instead.`, { file: f.filename });
            }

            let body = `${MARKER}\n### ⚠️ This PR changes the database structure\n\n`
              + 'Merging it requires running migrations on deploy (`pocketbase migrate up`, run automatically at startup by `backend/entrypoint.sh`).\n';
            if (added.length) {
              body += `\n**New migrations**\n${added.map(item).join('\n')}\n`;
            }
            if (changed.length) {
              body += `\n**Edited or removed existing migrations**\n${changed.map(item).join('\n')}\n\n`
                + '> PocketBase does not re-run migrations it has already applied, so these edits are silently ignored on '
                + 'environments that already ran them. Add a new migration instead.\n';
            }
            body += '\n**Checklist**\n'
              + '- [ ] API rule changes are documented in `docs/API.md`\n'
              + '- [ ] Rule tests added or updated in `backend/tests/rules.sh`\n'
              + '- [ ] Data model changes reflected in `docs/ARCHITECTURE.md` §4\n';

            await core.summary.addRaw(body.replace(MARKER, '')).write();

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pull_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body });
            }
