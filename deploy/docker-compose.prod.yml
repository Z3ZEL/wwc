# Production example: PocketBase only. The frontend is a static bundle hosted elsewhere
# (scripts/build-frontend.sh). Put a TLS-terminating proxy in front of port 8090.
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  pocketbase:
    build: ../backend
    image: wwc-pocketbase
    env_file: ../.env.prod
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      # SQLite database + local backups. Files and backups also go to S3 when configured.
      - pb_data:/pb_data

volumes:
  pb_data:
